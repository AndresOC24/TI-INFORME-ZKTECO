# Apache de Laragon sirve la compilacion estatica de Astro.
Listen 192.168.14.100:9091
Listen 127.0.0.1:9091

<VirtualHost *:9091>
    ServerName 192.168.14.100
    DocumentRoot "C:/laragon/www/TI-INFORME-ZKTECO/dist"
    DirectoryIndex index.html

    <Directory "C:/laragon/www/TI-INFORME-ZKTECO/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
