# Apache sirve las paginas estaticas y envia la API al servidor Node.
# Requiere mod_proxy y mod_proxy_http.
Listen 192.168.14.100:9091
Listen 127.0.0.1:9091

<VirtualHost *:9091>
    ServerName 192.168.14.100
    DocumentRoot "C:/laragon/www/TI-INFORME-ZKTECO/dist/client"
    DirectoryIndex index.html

    RedirectMatch 302 ^/$ /principal
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:4322/api/
    ProxyPassReverse /api/ http://127.0.0.1:4322/api/

    <Directory "C:/laragon/www/TI-INFORME-ZKTECO/dist/client">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
